<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Home</title>
</head>
<body class="bg-amber-50 dark:bg-gray-600">

<div th:replace="~{fragments/nav :: navbar}"></div>

<header class="bg-white dark:bg-gray-900">

  <div class="lg:flex">
    <div class="flex items-center justify-center w-full px-6 py-8 lg:h-[32rem] lg:w-1/2">
      <div class="max-w-xl">
        <h2 class="text-3xl font-semibold text-gray-800 dark:text-white lg:text-4xl">Encuentra tus libros favoritos <span class="text-blue-600 dark:text-blue-400">aquí.</span></h2>

        <p class="mt-4 text-sm text-gray-500 dark:text-gray-400 lg:text-base">El mejor lugar para comprar, vender y rentar libros de cualquier categoría.</p>

        <div class="flex flex-col mt-6 space-y-3 lg:space-y-0 lg:flex-row">
          <a th:href="@{/libros/home}" class="block px-5 py-2 text-sm font-medium tracking-wider text-center text-white transition-colors duration-300 transform bg-gray-900 rounded-md hover:bg-gray-700">Buscar</a>
          <a th:href="@{/libros/formulario}" class="block px-5 py-2 text-sm font-medium tracking-wider text-center text-gray-700 transition-colors duration-300 transform bg-gray-200 rounded-md lg:mx-4 hover:bg-gray-300">Registar Libro</a>
        </div>
      </div>
    </div>

    <div class="w-full h-64 lg:w-1/2 lg:h-auto">
      <div class="w-full h-full bg-cover" style="background-image: url(https://dynamic-media-cdn.tripadvisor.com/media/photo-o/10/2f/18/02/best-selection-in-quito.jpg?w=1200&h=-1&s=1)">
        <div class="w-full h-full bg-black opacity-25"></div>
      </div>
    </div>
  </div>
</header>

<section class="container px-6 py-12 mx-auto">
  <h2 class="text-2xl font-semibold text-gray-800 dark:text-white text-center">Novedades</h2>

  <div class="grid gap-6 mt-8 sm:grid-cols-2 lg:grid-cols-4">

    <div class="overflow-hidden bg-white rounded-lg shadow-lg dark:bg-gray-800">
      <div class="px-4 py-2">
        <h3 class="text-xl font-bold text-gray-800 uppercase dark:text-white">IT</h3>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Stephen King</p>
      </div>

      <img th:src="@{/images/IT.jpg}" class="object-contain w-full h-72 p-2 mt-2 bg-gray-100 dark:bg-gray-700" alt="IT" />

      <div class="flex items-center justify-between px-4 py-2 bg-gray-900">
        <span class="text-lg font-bold text-white">$30.00</span>
        <button class="px-2 py-1 text-xs font-semibold text-gray-900 uppercase transition-colors duration-300 transform bg-white rounded hover:bg-gray-200 focus:bg-gray-400 focus:outline-none">Add to cart</button>
      </div>
    </div>

  </div>
</section>


<footer class="bg-white dark:bg-gray-900">
  <div class="container px-6 py-6 mx-auto text-center">
    <p class="text-sm text-gray-500 dark:text-gray-400">© 2026 Librería PUCE. Todos los derechos reservados.</p>
  </div>
</footer>

</body>
</html>
