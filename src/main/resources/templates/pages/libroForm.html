<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Libro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-amber-50 dark:bg-gray-900">

<div th:replace="~{fragments/nav :: navbar}"></div>

<form class="max-w-md mx-auto my-12 p-8 bg-white border border-gray-200 rounded-lg shadow-lg dark:bg-gray-800 dark:border-gray-700">
    <h1 class="mb-8 text-3xl font-bold text-center text-gray-800 dark:text-white">
        Registro de <span class="text-amber-600">Libros</span>
    </h1>

    <h6 class="mb-8 text-xl font-bold text-center text-gray-600/60 dark:text-white/60">
        Registra tus libros <span class="text-amber-600/70">favoritos</span>
    </h6>

    <div class="relative z-0 w-full mb-6 group">
        <input type="text" name="titulo" id="titulo" class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-amber-600 peer text-gray-800 dark:text-white" placeholder=" " required />
        <label for="titulo" class="absolute text-sm duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-amber-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto text-gray-500 dark:text-gray-400">Título</label>
    </div>
    <div class="relative z-0 w-full mb-6 group">
        <input type="text" name="editorial" id="editorial" class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-amber-600 peer text-gray-800 dark:text-white" placeholder=" " required />
        <label for="editorial" class="absolute text-sm duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-amber-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto text-gray-500 dark:text-gray-400">Editorial</label>
    </div>
    <div class="relative z-0 w-full mb-6 group">
        <input type="text" name="genero" id="genero" class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-amber-600 peer text-gray-800 dark:text-white" placeholder=" " required />
        <label for="genero" class="absolute text-sm duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-amber-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto text-gray-500 dark:text-gray-400">Género</label>
    </div>
    <div class="relative z-0 w-full mb-8 group">
        <input type="number" name="num" id="num" class="block py-2.5 px-0 w-full text-sm bg-transparent border-0 border-b-2 border-gray-300 dark:border-gray-600 appearance-none focus:outline-none focus:ring-0 focus:border-amber-600 peer text-gray-800 dark:text-white" placeholder=" " required />
        <label for="num" class="absolute text-sm duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 peer-focus:text-amber-600 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto text-gray-500 dark:text-gray-400">Num. Páginas</label>
    </div>

    <button type="submit" class="w-full px-5 py-3 text-sm font-medium tracking-wide text-white transition-colors duration-300 bg-amber-600 rounded-lg shadow hover:bg-amber-500 focus:outline-none focus:ring-4 focus:ring-amber-300">Registrar libro</button>
</form>

<footer class="bg-white dark:bg-gray-900">
    <div class="container px-6 py-6 mx-auto text-center">
        <p class="text-sm text-gray-500 dark:text-gray-400">© 2026 Librería PUCE. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
